<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard — tableau infini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FBF9F4'/%3E%3Cpath d='M 25 35 L 40 70 L 50 50 L 60 70 L 75 35' fill='none' stroke='%233A5A78' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #EDE9E0;
      --paper-line: #d9d3c4;
      --ink: #2B2B2B;
      --ink-soft: #6b675f;
      --blueprint: #3A5A78;
      --amber: #D8A24A;
      --card-bg: #FBF9F4;
      --danger: #B4543D;
      --radius: 10px;
      --shadow: 0 2px 6px rgba(43, 43, 43, 0.12), 0 8px 20px rgba(43, 43, 43, 0.08);
      --shadow-lift: 0 6px 16px rgba(43, 43, 43, 0.18), 0 16px 36px rgba(43, 43, 43, 0.14);
      --sidebar-w: 260px;
      --sidebar-bg: #F5F2EA;
      --sidebar-border: #DDD8CC;
      --sidebar-item-hover: #EAE6DB;
      --sidebar-item-active: #E0DBD0;
    }
    :root[data-theme="dark"] {
      --paper: #161616;
      --paper-line: #262626;
      --ink: #EAEAEA;
      --ink-soft: #A0A0A0;
      --blueprint: #5E8CB8;
      --amber: #E2B663;
      --card-bg: #222222;
      --danger: #D46A54;
      --sidebar-bg: #1A1A1A;
      --sidebar-border: #2A2A2A;
      --sidebar-item-hover: #262626;
      --sidebar-item-active: #333333;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.3);
      --shadow-lift: 0 6px 16px rgba(0, 0, 0, 0.6), 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ---------- Layout shell ---------- */
    #shell {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100%;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      transition: width .22s cubic-bezier(.4, 0, .2, 1), min-width .22s cubic-bezier(.4, 0, .2, 1), opacity .18s ease;
      overflow: hidden;
      z-index: 100;
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    #sidebar-brand {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 18px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
    }

    #sidebar-brand .mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blueprint);
      flex-shrink: 0;
    }

    #btn-new-board {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 10px 10px 4px;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      background: var(--blueprint);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .14s ease, transform .1s ease;
      flex-shrink: 0;
    }

    #btn-new-board:hover {
      background: #2d4a66;
      transform: translateY(-1px);
    }

    #btn-new-board svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    #boards-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
    }

    #boards-list::-webkit-scrollbar {
      width: 4px;
    }

    #boards-list::-webkit-scrollbar-thumb {
      background: var(--paper-line);
      border-radius: 4px;
    }

    .board-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 8px 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s ease;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
    }

    .board-item:hover {
      background: var(--sidebar-item-hover);
    }

    .board-item.active {
      background: var(--sidebar-item-active);
    }

    .board-item .board-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--ink-soft);
    }

    .board-item .board-name {
      flex: 1;
      font-size: 13px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .board-item.active .board-name {
      font-weight: 500;
    }

    .board-item .board-name-input {
      flex: 1;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border: none;
      outline: 1px solid var(--blueprint);
      border-radius: 4px;
      padding: 1px 4px;
      background: #fff;
      color: var(--ink);
    }

    .board-item .board-del {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .1s ease, color .1s ease;
    }

    .board-item:hover .board-del {
      display: flex;
    }

    .board-item .board-del:hover {
      background: var(--danger);
      color: #fff;
    }

    .board-item .board-del svg {
      width: 13px;
      height: 13px;
    }

    #sidebar-footer {
      padding: 10px 12px 14px;
      border-top: 1px solid var(--sidebar-border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--ink-soft);
      flex-shrink: 0;
      line-height: 1.4;
    }

    /* ---------- Main area ---------- */
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #viewport {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: default;
      background-color: var(--paper);
    }

    #viewport.panning {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
    }

    /* ---------- Sidebar toggle button ---------- */
    #btn-sidebar-toggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 55;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: none;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: background .12s ease, box-shadow .12s ease;
    }

    #btn-sidebar-toggle:hover {
      background: var(--paper);
      box-shadow: var(--shadow-lift);
    }

    #btn-sidebar-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* ---------- Top brand bar / breadcrumb ---------- */
    #breadcrumbBar {
      position: absolute;
      top: 16px;
      left: 60px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0;
      max-width: 60vw;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
    }

    #breadcrumbBar::-webkit-scrollbar {
      display: none;
    }

    .crumb {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 17px;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .crumb-home .mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blueprint);
      display: inline-block;
      flex: 0 0 auto;
    }

    .crumb.current {
      color: var(--ink);
      cursor: default;
    }

    .crumb:not(.current):hover {
      text-decoration: underline;
    }

    .crumb-sep {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: #b3ad9e;
      font-size: 17px;
      margin: 0 6px;
      flex: 0 0 auto;
      user-select: none;
    }

    /* ---------- Bottom toolbar ---------- */
    #toolbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--card-bg);
      border: 1px solid var(--paper-line);
      border-radius: 14px;
      padding: 6px;
      box-shadow: var(--shadow);
    }

    .tbtn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: background .12s ease;
    }

    .tbtn:hover {
      background: var(--paper);
    }

    .tbtn svg {
      width: 19px;
      height: 19px;
    }

    #zoomLabel,
    .selection-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      min-width: 44px;
      width: auto;
      padding: 0 2px;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .selection-status {
      opacity: 0.95;
      min-width: 70px;
      text-align: left;
    }

    .tsep {
      width: 1px;
      height: 24px;
      background: var(--paper-line);
      margin: 0 4px;
    }

    /* ---------- Add menu ---------- */
    #addMenu {
      position: absolute;
      z-index: 80;
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--paper-line);
      border-radius: 14px;
      box-shadow: var(--shadow-lift);
      padding: 8px;
      grid-template-columns: repeat(3, 64px);
      gap: 4px;
      font-family: 'IBM Plex Mono', monospace;
    }

    #addMenu.open {
      display: grid;
    }

    #addMenu button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      border-radius: 9px;
      padding: 9px 4px 7px;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      font-size: 9.5px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    #addMenu button:hover {
      background: var(--paper);
    }

    #addMenu button svg {
      width: 19px;
      height: 19px;
      stroke: var(--blueprint);
    }

    #addPin {
      position: absolute;
      z-index: 79;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      display: none;
      pointer-events: none;
      box-shadow: 0 0 0 4px rgba(216, 162, 74, 0.25);
    }

    #addPin.open {
      display: block;
    }

    /* ---------- Blocks ---------- */
    .block {
      position: absolute;
      background: var(--card-bg);
      border: 1px solid var(--paper-line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 1;
      transform-origin: center center;
      transition: box-shadow .15s ease, transform .18s ease, opacity .18s ease;
    }

    .block.pop {
      animation: blockPop .34s ease-out forwards;
    }

    .block.leaving {
      animation: blockFade .24s ease forwards;
      pointer-events: none;
    }

    .block-particles {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      z-index: 10000;
    }

    .block-particles .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blueprint);
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: particleBurst .34s ease-out forwards;
    }

    @keyframes blockPop {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      70% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes blockFade {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(0.9);
      }
    }

    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.1);
      }
    }

    .block.selected {
      outline: 2px solid var(--blueprint);
      outline-offset: 2px;
    }

    .block.dragging,
    .block.resizing {
      box-shadow: var(--shadow-lift);
      z-index: 99999 !important;
    }

    .block-bar {
      height: 26px;
      min-height: 26px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      cursor: grab;
      background: rgba(0, 0, 0, 0.025);
      border-bottom: 1px solid var(--paper-line);
    }

    .block-bar:active {
      cursor: grabbing;
    }

    .block-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .block-type-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .block-close {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-size: 13px;
      line-height: 1;
    }

    .block-close:hover {
      background: var(--danger);
      color: #fff;
    }

    .block-body {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background: transparent;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--ink-soft);
      border-bottom: 2px solid var(--ink-soft);
      opacity: .5;
    }

    /* text block */
    .text-content {
      flex: 1;
      padding: 10px 12px;
      outline: none;
      overflow: auto;
      cursor: text;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      -webkit-user-select: text;
      user-select: text;
    }

    .text-content:empty::before {
      content: attr(data-placeholder);
      color: #b3ad9e;
    }

    .color-row {
      display: flex;
      gap: 5px;
      padding: 6px 8px;
      border-top: 1px solid var(--paper-line);
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .swatch.active {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    /* image block */
    .image-body {
      align-items: center;
      justify-content: center;
      background: #f3f0e8;
    }

    .image-body img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
    }

    .upload-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      text-align: center;
      padding: 10px;
    }

    .upload-placeholder svg {
      width: 24px;
      height: 24px;
      stroke: var(--ink-soft);
    }

    .upload-placeholder:hover {
      background: var(--paper);
    }

    .file-body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f7f2;
      padding: 12px;
      box-sizing: border-box;
    }

    .file-content {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 100%;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(58, 90, 120, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--blueprint);
    }

    .file-info {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.87rem;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-replace {
      border: none;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.82rem;
    }

    .file-replace:hover {
      background: var(--paper);
    }

    /* drawing block */
    .draw-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-bottom: 1px solid var(--paper-line);
      background: rgba(0, 0, 0, 0.02);
    }

    .draw-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .draw-swatch.active {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .draw-clear {
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .03em;
      background: transparent;
      border: 1px solid var(--paper-line);
      border-radius: 6px;
      padding: 3px 7px;
      cursor: pointer;
      color: var(--ink-soft);
    }

    .draw-clear:hover {
      background: var(--paper);
    }

    .drawing-canvas {
      flex: 1;
      touch-action: none;
      cursor: crosshair;
      background: #fff;
    }

    /* voice block */
    .voice-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
    }

    .rec-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--danger);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rec-btn .sq {
      width: 16px;
      height: 16px;
      background: var(--danger);
      border-radius: 50%;
      transition: border-radius .15s;
    }

    .rec-btn.recording .sq {
      border-radius: 3px;
    }

    .rec-btn.recording {
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(180, 84, 61, 0.35);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(180, 84, 61, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(180, 84, 61, 0);
      }
    }

    .voice-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--ink-soft);
      text-align: center;
    }

    .voice-body audio {
      width: 100%;
    }

    .voice-redo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--paper-line);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      color: var(--ink-soft);
    }

    /* link block */
    .link-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .link-input-row {
      display: flex;
      gap: 6px;
      padding: 10px;
    }

    .link-input-row input {
      flex: 1;
      border: 1px solid var(--paper-line);
      border-radius: 7px;
      padding: 7px 9px;
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      outline: none;
      background: #fff;
    }

    .link-input-row input:focus {
      border-color: var(--blueprint);
    }

    .link-go {
      border: none;
      background: var(--blueprint);
      color: #fff;
      border-radius: 7px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .link-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
    }

    .link-card img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .link-card .domain {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      word-break: break-all;
      text-align: center;
    }

    .link-edit {
      position: absolute;
      top: 2px;
      right: 26px;
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      background: transparent;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      text-decoration: underline;
    }

    /* video block */
    .video-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .video-body video,
    .video-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }

    .video-setup {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: var(--card-bg);
    }

    .video-setup input {
      border: 1px solid var(--paper-line);
      border-radius: 7px;
      padding: 7px 9px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      outline: none;
    }

    .video-setup input:focus {
      border-color: var(--blueprint);
    }

    .video-setup .or {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--ink-soft);
      text-align: center;
      letter-spacing: .05em;
    }

    .video-setup button {
      border: 1px solid var(--paper-line);
      background: #fff;
      border-radius: 7px;
      padding: 7px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--ink);
    }

    .video-setup button:hover {
      background: var(--paper);
    }

    /* folder block */
    .folder-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      text-align: center;
    }

    .folder-icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--blueprint);
    }

    .folder-name {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      cursor: text;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 5px;
      border-radius: 4px;
      -webkit-user-select: text;
      user-select: text;
    }

    .folder-name:focus {
      background: var(--paper);
      white-space: normal;
      overflow: visible;
    }

    .folder-name:empty::before {
      content: attr(data-placeholder);
      color: #b3ad9e;
    }

    .folder-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--ink-soft);
    }

    .folder-open {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: transparent;
      border: 1px solid var(--paper-line);
      border-radius: 7px;
      padding: 5px 10px;
      cursor: pointer;
      color: var(--blueprint);
      margin-top: 2px;
    }

    .folder-open:hover {
      background: var(--paper);
    }

    .block.drop-target {
      outline: 2px dashed var(--amber);
      outline-offset: 3px;
      background: #FBF3E4;
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
    }

    .empty-state .big {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .empty-state .small {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #b3ad9e;
    }

    #toast {
      position: absolute;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--ink);
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      z-index: 200;
      max-width: 320px;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Windows Desktop Marquee Selection Box */
    #selectionMarquee {
      position: absolute;
      border: 1px dashed var(--blueprint);
      background: rgba(58, 90, 120, 0.18);
      pointer-events: none;
      z-index: 9999;
      display: none;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(58, 90, 120, 0.15);
    }

    /* SVG Connector Lines & Arrowheads */
    @keyframes connectorDashFlow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes menuPopIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -85%) scale(0.8);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
      }
    }
    .connector-line, .connector-line:hover {
      stroke: var(--blueprint);
      stroke-width: 4.2px !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      marker-end: url(#arrowhead);
      transition: stroke .2s ease, stroke-dasharray .2s ease;
      cursor: pointer;
      filter: none !important;
      transform: none !important;
    }
    .connector-line.selected {
      stroke: var(--danger) !important;
      stroke-width: 5.5px !important;
      filter: drop-shadow(0 0 6px rgba(201, 123, 103, 0.6)) !important;
    }
    .connector-line.temp-line {
      stroke: var(--blueprint);
      stroke-dasharray: 8 5;
      stroke-width: 4.2px !important;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      marker-end: url(#arrowhead);
      animation: connectorDashFlow 0.8s linear infinite;
    }

    /* Connector Context Menu */
    .connector-menu {
      display: none;
      position: absolute;
      z-index: 10000;
      background: var(--card-bg);
      border: 1px solid var(--paper-line);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 4px 10px -2px rgba(0, 0, 0, 0.08);
      padding: 6px 10px;
      gap: 6px;
      align-items: center;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      transform: translate(-50%, -100%) translateY(-10px);
      backdrop-filter: blur(8px);
    }
    .connector-menu.open {
      display: flex;
      animation: menuPopIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .connector-menu-btn {
      border: 1px solid var(--paper-line);
      background: var(--paper);
      color: var(--ink);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .connector-menu-btn:hover {
      background: var(--paper-line);
    }
    .connector-menu-btn.active {
      background: var(--blueprint);
      color: #fff;
      border-color: var(--blueprint);
    }
    .connector-menu-btn.danger:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .connector-color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid rgba(0,0,0,0.15);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .connector-color-swatch:hover {
      transform: scale(1.3);
    }

    /* Top Action Bar (Search & Bookmarks) */
    .top-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid var(--paper-line);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: background .12s, transform .1s;
    }
    .top-icon-btn:hover {
      background: var(--paper);
      transform: translateY(-1px);
    }

    /* Search Box */
    .search-box {
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      border: 1px solid var(--blueprint);
      border-radius: 10px;
      padding: 3px 6px;
      box-shadow: var(--shadow-lift);
      font-family: 'Inter', sans-serif;
      position: absolute;
      right: 100%;
      top: 0;
      margin-right: 8px;
    }
    .search-box.open { display: flex; }
    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 12.5px;
      color: var(--ink);
      width: 140px;
      padding: 4px;
    }
    .search-box #searchCount {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--ink-soft);
      padding: 0 4px;
    }
    .search-box button {
      background: transparent;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      padding: 2px 5px;
      font-size: 11px;
      border-radius: 4px;
    }
    .search-box button:hover { background: var(--paper); color: var(--ink); }

    /* Search match highlight */
    .block.search-match {
      outline: 3px solid var(--amber) !important;
      outline-offset: 3px;
      box-shadow: 0 0 16px rgba(216, 162, 74, 0.45) !important;
    }

    /* Bookmarks Menu */
    .bookmark-menu {
      display: none;
      position: absolute;
      top: 44px;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--paper-line);
      border-radius: 12px;
      box-shadow: var(--shadow-lift);
      padding: 10px;
      min-width: 190px;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    .bookmark-menu.open { display: flex; }
    .bm-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }
    .bm-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--paper);
      font-size: 12px;
      cursor: pointer;
      transition: background .12s;
    }
    .bm-item:hover { background: var(--sidebar-item-hover); }
    .bm-item .bm-del {
      border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 12px;
    }
    .bm-item .bm-del:hover { color: var(--danger); }
    #btnAddBookmark {
      border: 1px dashed var(--blueprint);
      background: transparent;
      color: var(--blueprint);
      border-radius: 7px;
      padding: 6px;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      transition: background .12s;
    }
    #btnAddBookmark:hover { background: #E7EEF5; }

    /* Minimap */
    #minimap {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 140px;
      height: 95px;
      background: rgba(30, 41, 59, 0.2);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      box-shadow: var(--shadow);
      z-index: 50;
      overflow: hidden;
      cursor: crosshair;
      opacity: 0.4;
      transition: opacity 0.2s, background 0.2s;
    }
    #minimap:hover {
      opacity: 0.95;
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(4px);
    }
    #minimapCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #minimapViewport {
      position: absolute;
      border: 1.5px solid var(--blueprint);
      background: rgba(58, 90, 120, 0.12);
      pointer-events: none;
      box-sizing: border-box;
    }



    /* Text formatting toolbar in note block */
    .fmt-row {
      display: flex;
      gap: 3px;
      padding: 4px 6px;
      border-top: 1px solid var(--paper-line);
      background: rgba(0,0,0,0.02);
    }
    .fmt-btn {
      border: 1px solid var(--paper-line);
      background: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10.5px;
      cursor: pointer;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
    }
    .fmt-btn:hover { background: var(--paper); }

    /* Connectors SVG */
    .connector-line {
      stroke: var(--blueprint);
      stroke-width: 2.2;
      stroke-linecap: round;
      fill: none;
      transition: stroke .15s;
    }
    .connector-line:hover {
      stroke: var(--danger);
      stroke-width: 3.5;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="shell">

    <!-- ========== SIDEBAR ========== -->
    <nav id="sidebar">
      <div id="sidebar-header">
        <div id="sidebar-brand"><span class="mark"></span>Whiteboard</div>
      </div>

      <button id="btn-new-board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Nouveau tableau
      </button>

      <div id="boards-list"></div>

      <div id="sidebar-footer">
        Double-clic sur le tableau<br>pour ajouter un bloc
      </div>
    </nav>

    <!-- ========== MAIN ========== -->
    <div id="main">

      <!-- Sidebar toggle -->
      <button id="btn-sidebar-toggle" title="Afficher / masquer le panneau">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>

      <div id="breadcrumbBar">
        <span id="crumbHome" class="crumb crumb-home current"><span class="mark"></span>Whiteboard</span>
        <span id="crumbTrail"></span>
      </div>

      <!-- Top Right Actions: Search & Bookmarks -->
      <div class="top-actions">
        <div id="searchWidget" style="position:relative;">
          <button id="btnSearchToggle" class="top-icon-btn" title="Recherche rapide (Ctrl + F)">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <div id="searchBox" class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher... (Ctrl+F)" />
            <span id="searchCount"></span>
            <button id="searchPrev" title="Précédent">▲</button>
            <button id="searchNext" title="Suivant">▼</button>
            <button id="searchClose" title="Fermer">✕</button>
          </div>
        </div>

        <div id="bookmarkWidget" style="position:relative;">
          <button id="btnBookmarkToggle" class="top-icon-btn" title="Marque-pages de vue">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <div id="bookmarkMenu" class="bookmark-menu">
            <div class="bm-title">Marque-pages (Vues)</div>
            <div id="bookmarkList"></div>
            <button id="btnAddBookmark">+ Enregistrer la vue</button>
          </div>
        </div>
      </div>

      <div id="viewport">
        <div id="world">
          <svg id="connectorsCanvas" style="position:absolute; top:0; left:0; width:1px; height:1px; overflow:visible; pointer-events:none; z-index:5;"></svg>
        </div>
        <div id="selectionMarquee"></div>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="big">Ton tableau est vide</div>
        <div class="small">DOUBLE-CLIC QUELQUE PART POUR COMMENCER</div>
      </div>

      <div id="addPin"></div>
      <div id="addMenu">
        <button data-type="text"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 6h16M4 12h16M4 18h10" />
          </svg>Note</button>
        <button data-type="image"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <circle cx="8.5" cy="9.5" r="1.5" />
            <path d="M21 16l-5-5-6 6" />
          </svg>Image</button>
        <button data-type="drawing"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 20l7-7a2.8 2.8 0 0 0-4-4l-7 7v4h4z" />
            <path d="M4 20h4" />
          </svg>Dessin</button>
        <button data-type="voice"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>Vocal</button>
        <button data-type="link"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 15l6-6M10 6l1-1a4 4 0 0 1 6 6l-1 1M14 18l-1 1a4 4 0 0 1-6-6l1-1" />
          </svg>Lien</button>
        <button data-type="video"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="5" width="14" height="14" rx="2" />
            <path d="M17 10l4-2.5v9L17 14" />
          </svg>Vidéo</button>
        <button data-type="file"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M6 4h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
            <path d="M14 4v4h4" />
            <path d="M9 12h6M9 16h6" />
          </svg>Fichier</button>
        <button data-type="folder"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
          </svg>Dossier</button>
      </div>

      <div id="toolbar">
        <button class="tbtn" id="btnZoomOut" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3M8 11h6" />
          </svg></button>
        <span id="zoomLabel">100%</span>
        <span id="selectionLabel" class="selection-status"></span>
        <button class="tbtn" id="btnZoomIn" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3M11 8v6M8 11h6" />
          </svg></button>
        <button class="tbtn" id="btnZoomReset" title="Réinitialiser la vue"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg></button>
        <div class="tsep"></div>
        <button class="tbtn" id="btnClear" title="Vider le canva"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
          </svg></button>
        <div class="tsep"></div>
        <button class="tbtn" id="btnThemeToggle" title="Mode sombre"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg></button>
      </div>

      <div id="minimap" title="Cliquer pour se déplacer sur le tableau">
        <canvas id="minimapCanvas" width="140" height="95"></canvas>
        <div id="minimapViewport"></div>
      </div>

      <div id="toast"></div>

      <div id="connectorMenu" class="connector-menu">
        <button class="connector-menu-btn" data-style="solid">━ Pleine</button>
        <button class="connector-menu-btn" data-style="dashed">╌ Tirets</button>
        <button class="connector-menu-btn" data-style="dotted">┈ Pointillée</button>
        <div style="width:1px; height:16px; background:var(--paper-line); margin:0 2px;"></div>
        <span class="connector-color-swatch" data-color="#3A5A78" style="background:#3A5A78;" title="Bleu"></span>
        <span class="connector-color-swatch" data-color="#C97B67" style="background:#C97B67;" title="Rouge"></span>
        <span class="connector-color-swatch" data-color="#8AA88F" style="background:#8AA88F;" title="Vert"></span>
        <span class="connector-color-swatch" data-color="#D8A24A" style="background:#D8A24A;" title="Jaune"></span>
        <div style="width:1px; height:16px; background:var(--paper-line); margin:0 2px;"></div>
        <button class="connector-menu-btn danger" id="btnDeleteConnector" title="Supprimer le lien">🗑️</button>
      </div>

    </div><!-- /main -->
  </div><!-- /shell -->

  <script>
    (function () {
      "use strict";

      // ---------------------------------------------------------------
      // State
      // ---------------------------------------------------------------
      var viewport = document.getElementById('viewport');
      var world = document.getElementById('world');
      var emptyState = document.getElementById('emptyState');
      var zoomLabel = document.getElementById('zoomLabel');
      var selectionLabel = document.getElementById('selectionLabel');
      var btnDeleteSelected = document.getElementById('btnDeleteSelected');
      var btnGroupSelected = document.getElementById('btnGroupSelected');
      var toastEl = document.getElementById('toast');

      var camera = { x: 0, y: 0, zoom: 1 };   // world->screen: screenX = worldX*zoom + camera.x
      var blocks = [];                          // { id, type, x, y, w, h, z, ...typeData }
      var blockEls = {};                        // id -> DOM element
      var maxZ = 1;
      var selectedIds = [];
      var selectedConnectorIds = [];
      var saveMetaTimer = null;

      // ---- Board navigation (dossiers = tableaux infinis imbriqués) ----
      var currentBoardId = 'root';              // id du tableau affiché dans le tableau actif
      var currentBoardName = 'Whiteboard';
      var boardStack = [];                      // [{id, name}, ...] chemin depuis la racine
      var localBoards = {};                     // cache en mémoire de session: boardId -> payload

      // ---- Multi-board sidebar (localStorage) ----
      var BOARDS_INDEX_KEY = 'atelier-v1-boards-index';
      var ACTIVE_BOARD_KEY = 'atelier-v1-active-board';
      var activeBoardId = null;  // l'identifiant du tableau sélectionné dans la sidebar

      var COLORS = ['#FBF9F4', '#E8EFE6', '#E7EEF5', '#F6E9E7', '#F3EBDA', '#EEE7F2'];
      var DOT_COLORS = ['#3A5A78', '#8AA88F', '#C97B67', '#D8A24A', '#8E7CB0', '#5C7A99', '#B4924A'];

      // ---------------------------------------------------------------
      // Multi-board index management
      // ---------------------------------------------------------------
      function getBoardsIndex() {
        try { return JSON.parse(localStorage.getItem(BOARDS_INDEX_KEY) || '[]'); } catch (e) { return []; }
      }
      function saveBoardsIndex(list) {
        localStorage.setItem(BOARDS_INDEX_KEY, JSON.stringify(list));
      }
      function generateBoardId() { return 'brd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

      function createNewBoard(name) {
        var list = getBoardsIndex();
        var id = generateBoardId();
        var board = { id: id, name: name || ('Tableau ' + (list.length + 1)), createdAt: Date.now() };
        list.unshift(board);
        saveBoardsIndex(list);
        return board;
      }

      function renameBoardInIndex(id, newName) {
        var list = getBoardsIndex();
        var b = list.find(function (x) { return x.id === id; });
        if (b) { b.name = newName; saveBoardsIndex(list); }
      }

      function deleteBoardFromIndex(id) {
        var list = getBoardsIndex().filter(function (x) { return x.id !== id; });
        saveBoardsIndex(list);
        var keysToDelete = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.startsWith('atelier-v1-board:' + id)) keysToDelete.push(k);
        }
        keysToDelete.forEach(function (k) { localStorage.removeItem(k); });
      }

      // ---------- Sidebar rendering ----------
      var boardsList = document.getElementById('boards-list');

      function renderSidebar() {
        var list = getBoardsIndex();
        boardsList.innerHTML = '';
        list.forEach(function (board) {
          var item = document.createElement('div');
          item.className = 'board-item' + (board.id === activeBoardId ? ' active' : '');

          var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          icon.setAttribute('viewBox', '0 0 24 24'); icon.setAttribute('fill', 'none');
          icon.setAttribute('stroke', 'currentColor'); icon.setAttribute('stroke-width', '1.6');
          icon.setAttribute('stroke-linecap', 'round'); icon.setAttribute('stroke-linejoin', 'round');
          icon.setAttribute('class', 'board-icon');
          icon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/>';

          var nameEl = document.createElement('span');
          nameEl.className = 'board-name';
          nameEl.textContent = board.name;

          var delBtn = document.createElement('button');
          delBtn.className = 'board-del';
          delBtn.title = 'Supprimer ce tableau';
          delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
          delBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            var list2 = getBoardsIndex();
            if (list2.length <= 1) { showToast('Impossible de supprimer le seul tableau.'); return; }
            if (!confirm('Supprimer ce tableau et tous ses blocs ?')) return;
            deleteBoardFromIndex(board.id);
            if (activeBoardId === board.id) {
              var remaining = getBoardsIndex();
              switchToBoard(remaining[0]);
            } else {
              renderSidebar();
            }
          });

          item.addEventListener('click', function (e) {
            if (e.target.closest('.board-del')) return;
            if (board.id === activeBoardId) return;
            switchToBoard(board);
          });

          // Double-clic pour renommer
          nameEl.addEventListener('dblclick', function (e) {
            e.stopPropagation();
            var input = document.createElement('input');
            input.className = 'board-name-input';
            input.value = board.name;
            nameEl.replaceWith(input);
            input.focus(); input.select();
            function commit() {
              var newName = input.value.trim() || board.name;
              renameBoardInIndex(board.id, newName);
              board.name = newName;
              var newSpan = document.createElement('span');
              newSpan.className = 'board-name';
              newSpan.textContent = newName;
              input.replaceWith(newSpan);
              newSpan.addEventListener('dblclick', arguments.callee);
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function (ev) {
              if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
              if (ev.key === 'Escape') { input.value = board.name; input.blur(); }
              ev.stopPropagation();
            });
          });

          item.appendChild(icon);
          item.appendChild(nameEl);
          item.appendChild(delBtn);
          boardsList.appendChild(item);
        });
      }

      function switchToBoard(board) {
        flushSave();
        teardownBoard();
        activeBoardId = board.id;
        localStorage.setItem(ACTIVE_BOARD_KEY, activeBoardId);
        localBoards = {};
        currentBoardId = 'root';
        currentBoardName = board.name;
        boardStack = [];
        updateBreadcrumb();
        loadBoard('root');
        renderSidebar();
      }

      // ---------- Sidebar toggle ----------
      var sidebar = document.getElementById('sidebar');
      var sidebarOpen = true;
      document.getElementById('btn-sidebar-toggle').addEventListener('click', function () {
        sidebarOpen = !sidebarOpen;
        sidebar.classList.toggle('collapsed', !sidebarOpen);
      });

      // ---------- New board button ----------
      document.getElementById('btn-new-board').addEventListener('click', function () {
        flushSave();
        var board = createNewBoard();
        teardownBoard();
        activeBoardId = board.id;
        localStorage.setItem(ACTIVE_BOARD_KEY, activeBoardId);
        localBoards = {};
        currentBoardId = 'root';
        currentBoardName = board.name;
        boardStack = [];
        updateBreadcrumb();
        loadBoard('root');
        renderSidebar();
        showToast('Nouveau tableau créé.');
      });

      function uid() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function showToast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2600);
      }

      // ---------------------------------------------------------------
      // Modules state & functions (Connectors, Minimap, Search, Bookmarks, Snap, Lock)
      // ---------------------------------------------------------------
      var connectors = [];
      var connectingSourceId = null;

      var bookmarks = [];

      var searchMatches = [];
      var searchMatchIdx = 0;

      function openSearch() {
        var box = document.getElementById('searchBox');
        var input = document.getElementById('searchInput');
        if (!box || !input) return;
        box.classList.add('open');
        input.focus();
        input.select();
      }

      function closeSearch() {
        var box = document.getElementById('searchBox');
        if (box) box.classList.remove('open');
        clearSearchHighlights();
      }

      function clearSearchHighlights() {
        searchMatches = [];
        searchMatchIdx = 0;
        document.querySelectorAll('.block.search-match').forEach(function(el) {
          el.classList.remove('search-match');
        });
        var countEl = document.getElementById('searchCount');
        if (countEl) countEl.textContent = '';
      }

      function performSearch(query) {
        clearSearchHighlights();
        query = (query || '').trim().toLowerCase();
        if (!query) return;

        blocks.forEach(function(b) {
          var text = (b.text || '' ) + ' ' + (b.name || '') + ' ' + (b.url || '') + ' ' + (b.filename || '');
          if (text.toLowerCase().indexOf(query) !== -1) {
            searchMatches.push(b.id);
            var el = blockEls[b.id];
            if (el) el.classList.add('search-match');
          }
        });

        var countEl = document.getElementById('searchCount');
        if (countEl) {
          countEl.textContent = searchMatches.length ? (searchMatchIdx + 1) + '/' + searchMatches.length : '0';
        }

        if (searchMatches.length > 0) {
          focusSearchResult(0);
        }
      }

      function focusSearchResult(idx) {
        if (!searchMatches.length) return;
        searchMatchIdx = (idx + searchMatches.length) % searchMatches.length;
        var targetId = searchMatches[searchMatchIdx];
        var b = blocks.find(function(x) { return x.id === targetId; });
        if (b) {
          var vW = viewport.clientWidth || window.innerWidth;
          var vH = viewport.clientHeight || window.innerHeight;
          var targetX = vW / 2 - (b.x + b.w / 2) * camera.zoom;
          var targetY = vH / 2 - (b.y + b.h / 2) * camera.zoom;
          animateCameraTo({ x: targetX, y: targetY, zoom: camera.zoom }, 250);
          selectBlock(b.id);
        }
        var countEl = document.getElementById('searchCount');
        if (countEl) countEl.textContent = (searchMatchIdx + 1) + '/' + searchMatches.length;
      }

      // Connectors (Mind Mapping Links & Maltego-style arrows)
      function getBlockEdgeIntersection(fromPt, b) {
        var cx = b.x + b.w / 2;
        var cy = b.y + b.h / 2;
        var dx = fromPt.x - cx;
        var dy = fromPt.y - cy;
        if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) return { x: cx, y: cy };

        var hw = b.w / 2;
        var hh = b.h / 2;

        var scaleX = hw / Math.abs(dx);
        var scaleY = hh / Math.abs(dy);
        var scale = Math.min(scaleX, scaleY);

        return {
          x: cx + dx * scale,
          y: cy + dy * scale
        };
      }

      function startMaltegoConnection(sourceBlock, startEvent) {
        var svg = document.getElementById('connectorsCanvas');
        if (!svg) return;

        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'connector-line temp-line');
        path.setAttribute('style', 'pointer-events:none;');
        svg.appendChild(path);

        function onMove(e) {
          var mousePt = screenToWorld(e.clientX, e.clientY);
          var p1 = getBlockEdgeIntersection(mousePt, sourceBlock);
          var dx = mousePt.x - p1.x;
          var dy = mousePt.y - p1.y;
          path.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' C ' + (p1.x + dx * 0.4) + ' ' + (p1.y + dy * 0.4) + ', ' + (mousePt.x - dx * 0.4) + ' ' + (mousePt.y - dy * 0.4) + ', ' + mousePt.x + ' ' + mousePt.y);
        }

        function onUp(e) {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          if (path.parentNode) path.parentNode.removeChild(path);
          var dropEl = document.elementFromPoint(e.clientX, e.clientY);
          var blockEl = dropEl ? dropEl.closest('.block') : null;
          if (blockEl) {
            var targetId = blockEl.dataset.id;
            if (targetId && targetId !== sourceBlock.id) addConnector(sourceBlock.id, targetId);
          }
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      }

      function addConnector(fromId, toId) {
        if (fromId === toId) return;
        var exists = connectors.some(function(c) {
          return (c.fromId === fromId && c.toId === toId) || (c.fromId === toId && c.toId === fromId);
        });
        if (exists) {
          showToast('Ces deux blocs sont déjà reliés.');
          return;
        }
        var c = { id: uid(), fromId: fromId, toId: toId };
        connectors.push(c);
        renderConnectors();
        scheduleSaveMeta();
        showToast('Lien créé !');
      }

      var activeConnectorMenuId = null;

      function openConnectorMenu(c, clientX, clientY) {
        activeConnectorMenuId = c.id;
        var menu = document.getElementById('connectorMenu');
        if (!menu) return;

        menu.style.left = clientX + 'px';
        menu.style.top = clientY + 'px';
        menu.classList.add('open');

        menu.querySelectorAll('.connector-menu-btn[data-style]').forEach(function(btn) {
          var st = btn.getAttribute('data-style');
          btn.classList.toggle('active', (c.style || 'solid') === st);
        });
      }

      function closeConnectorMenu() {
        activeConnectorMenuId = null;
        var menu = document.getElementById('connectorMenu');
        if (menu) menu.classList.remove('open');
      }

      function removeConnector(id) {
        connectors = connectors.filter(function(c) { return c.id !== id; });
        renderConnectors();
        scheduleSaveMeta();
        closeConnectorMenu();
        showToast('Lien supprimé.');
      }

      function renderConnectors() {
        var svg = document.getElementById('connectorsCanvas');
        if (!svg) return;
        svg.innerHTML = '<defs>' +
          '<marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">' +
          '<path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>' +
          '</marker>' +
          '</defs>';

        connectors.forEach(function(c) {
          var b1 = blocks.find(function(x) { return x.id === c.fromId; });
          var b2 = blocks.find(function(x) { return x.id === c.toId; });
          if (!b1 || !b2) return;

          var c2 = { x: b2.x + b2.w / 2, y: b2.y + b2.h / 2 };
          var p1 = getBlockEdgeIntersection(c2, b1);
          var p2 = getBlockEdgeIntersection(p1, b2);

          var dx = p2.x - p1.x;
          var dy = p2.y - p1.y;

          var dashArray = 'none';
          if (c.style === 'dashed') dashArray = '8 5';
          else if (c.style === 'dotted') dashArray = '3 4';

          var color = c.color || '#3A5A78';

          var isSel = selectedConnectorIds.indexOf(c.id) !== -1;
          var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' C ' + (p1.x + dx * 0.4) + ' ' + p1.y + ', ' + (p2.x - dx * 0.4) + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y);
          path.setAttribute('class', 'connector-line' + (isSel ? ' selected' : ''));
          path.setAttribute('style', 'pointer-events:stroke; cursor:pointer; stroke: ' + (isSel ? 'var(--danger)' : color) + '; stroke-dasharray: ' + dashArray + ';');

          path.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            path.classList.add('connector-click-pulse');
            setTimeout(function() { path.classList.remove('connector-click-pulse'); }, 300);
            openConnectorMenu(c, e.clientX, e.clientY);
          });
          path.addEventListener('pointerdown', function(e) {
            if (e.button === 2) {
              e.preventDefault();
              e.stopPropagation();
              path.classList.add('connector-click-pulse');
              setTimeout(function() { path.classList.remove('connector-click-pulse'); }, 300);
              openConnectorMenu(c, e.clientX, e.clientY);
            }
          });

          svg.appendChild(path);
        });
      }

      // Initialize connector menu events
      (function initConnectorMenu() {
        var menu = document.getElementById('connectorMenu');
        if (!menu) return;
        menu.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
        menu.addEventListener('click', function(e) {
          e.stopPropagation();
          if (!activeConnectorMenuId) return;
          var conn = connectors.find(function(x) { return x.id === activeConnectorMenuId; });
          if (!conn) return;

          var styleBtn = e.target.closest('[data-style]');
          if (styleBtn) {
            conn.style = styleBtn.getAttribute('data-style');
            renderConnectors();
            scheduleSaveMeta();
            openConnectorMenu(conn, parseFloat(menu.style.left), parseFloat(menu.style.top));
            return;
          }

          var colorSwatch = e.target.closest('[data-color]');
          if (colorSwatch) {
            conn.color = colorSwatch.getAttribute('data-color');
            renderConnectors();
            scheduleSaveMeta();
            openConnectorMenu(conn, parseFloat(menu.style.left), parseFloat(menu.style.top));
            return;
          }

          var delBtn = e.target.closest('#btnDeleteConnector');
          if (delBtn) {
            removeConnector(conn.id);
            return;
          }
        });

        window.addEventListener('pointerdown', function(e) {
          if (!e.target.closest('#connectorMenu') && !e.target.closest('.connector-line')) {
            closeConnectorMenu();
          }
        });
      })();

      // Bookmarks (Saved Views)
      function renderBookmarks() {
        var list = document.getElementById('bookmarkList');
        if (!list) return;
        list.innerHTML = '';
        if (bookmarks.length === 0) {
          list.innerHTML = '<div style="font-size:11px;color:var(--ink-soft);padding:4px;">Aucun marque-page.</div>';
          return;
        }
        bookmarks.forEach(function(bm, idx) {
          var item = document.createElement('div');
          item.className = 'bm-item';
          item.innerHTML = '<span>' + bm.name + '</span><button class="bm-del" title="Supprimer">✕</button>';
          item.addEventListener('click', function(e) {
            if (e.target.classList.contains('bm-del')) {
              e.stopPropagation();
              bookmarks.splice(idx, 1);
              renderBookmarks();
              scheduleSaveMeta();
              return;
            }
            animateCameraTo(bm.camera, 300);
            var bmMenu = document.getElementById('bookmarkMenu');
            if (bmMenu) bmMenu.classList.remove('open');
          });
          list.appendChild(item);
        });
      }

      function addCurrentViewBookmark() {
        var name = prompt('Nom du marque-page :', 'Vue ' + (bookmarks.length + 1));
        if (!name) return;
        bookmarks.push({
          id: uid(),
          name: name.trim(),
          camera: { x: camera.x, y: camera.y, zoom: camera.zoom }
        });
        renderBookmarks();
        scheduleSaveMeta();
        showToast('Marque-page enregistré !');
      }

      // Minimap Navigation
      var minimapCanvas = document.getElementById('minimapCanvas');
      var minimapViewport = document.getElementById('minimapViewport');

      function updateMinimap() {
        if (!minimapCanvas || !minimapViewport) return;
        var ctx = minimapCanvas.getContext('2d');
        var mw = minimapCanvas.width;
        var mh = minimapCanvas.height;
        ctx.clearRect(0, 0, mw, mh);

        if (!blocks || blocks.length === 0) {
          minimapViewport.style.display = 'none';
          return;
        }

        var vW = viewport.clientWidth || window.innerWidth;
        var vH = viewport.clientHeight || window.innerHeight;
        var cMinX = -camera.x / camera.zoom;
        var cMinY = -camera.y / camera.zoom;
        var cMaxX = (vW - camera.x) / camera.zoom;
        var cMaxY = (vH - camera.y) / camera.zoom;

        var minX = cMinX, minY = cMinY, maxX = cMaxX, maxY = cMaxY;
        blocks.forEach(function(b) {
          if (b.x < minX) minX = b.x;
          if (b.y < minY) minY = b.y;
          if (b.x + b.w > maxX) maxX = b.x + b.w;
          if (b.y + b.h > maxY) maxY = b.y + b.h;
        });

        var pad = 100;
        minX -= pad; minY -= pad; maxX += pad; maxY += pad;

        var rangeX = maxX - minX || 1;
        var rangeY = maxY - minY || 1;
        var scale = Math.min(mw / rangeX, mh / rangeY);

        ctx.fillStyle = '#3A5A78';
        blocks.forEach(function(b) {
          var bx = (b.x - minX) * scale;
          var by = (b.y - minY) * scale;
          var bw = Math.max(3, b.w * scale);
          var bh = Math.max(3, b.h * scale);
          ctx.fillRect(bx, by, bw, bh);
        });

        var vx = (cMinX - minX) * scale;
        var vy = (cMinY - minY) * scale;
        var vw = (vW / camera.zoom) * scale;
        var vh = (vH / camera.zoom) * scale;

        minimapViewport.style.display = 'block';
        minimapViewport.style.left = Math.max(0, Math.min(mw - 4, vx)) + 'px';
        minimapViewport.style.top = Math.max(0, Math.min(mh - 4, vy)) + 'px';
        minimapViewport.style.width = Math.max(8, Math.min(mw, vw)) + 'px';
        minimapViewport.style.height = Math.max(8, Math.min(mh, vh)) + 'px';
      }



      // ---------------------------------------------------------------
      // Camera / coordinate transforms
      // ---------------------------------------------------------------
      function applyCamera() {
        world.style.transform = 'translate(' + camera.x + 'px,' + camera.y + 'px) scale(' + camera.zoom + ')';
        var gridSize = 32 * camera.zoom;
        viewport.style.backgroundImage =
          'linear-gradient(to right, var(--paper-line) 1px, transparent 1px),' +
          'linear-gradient(to bottom, var(--paper-line) 1px, transparent 1px)';
        viewport.style.backgroundSize = gridSize + 'px ' + gridSize + 'px';
        viewport.style.backgroundPosition = camera.x + 'px ' + camera.y + 'px';
        zoomLabel.textContent = formatZoom(camera.zoom);
        renderConnectors();
        updateMinimap();
      }

      function formatZoom(z) {
        var pct = z * 100;
        if (pct >= 1000) return Math.round(pct / 1000) + 'k%';
        if (pct >= 100) return Math.round(pct) + '%';
        if (pct >= 10) return pct.toFixed(1) + '%';
        if (pct >= 1) return pct.toFixed(2) + '%';
        return pct.toFixed(3) + '%';
      }

      function screenToWorld(clientX, clientY) {
        var rect = viewport.getBoundingClientRect();
        return {
          x: (clientX - rect.left - camera.x) / camera.zoom,
          y: (clientY - rect.top - camera.y) / camera.zoom
        };
      }

      // Smooth camera animation
      var cameraAnimation = null;
      function cancelCameraAnimation() {
        if (cameraAnimation) {
          cancelAnimationFrame(cameraAnimation);
          cameraAnimation = null;
        }
      }

      function animateCameraTo(target, duration) {
        cancelCameraAnimation();
        var start = performance.now();
        var from = { x: camera.x, y: camera.y, zoom: camera.zoom };
        var dx = target.x - from.x;
        var dy = target.y - from.y;
        var dz = target.zoom - from.zoom;
        if (duration <= 0) {
          camera.x = target.x;
          camera.y = target.y;
          camera.zoom = target.zoom;
          applyCamera();
          return;
        }
        function step(timestamp) {
          var t = Math.min(1, (timestamp - start) / duration);
          var ease = 1 - Math.pow(1 - t, 3);
          camera.x = from.x + dx * ease;
          camera.y = from.y + dy * ease;
          camera.zoom = from.zoom + dz * ease;
          applyCamera();
          if (t < 1) {
            cameraAnimation = requestAnimationFrame(step);
          } else {
            cameraAnimation = null;
          }
        }
        cameraAnimation = requestAnimationFrame(step);
      }

      // Zoom quasi infini (6 ordres de grandeur) : de 0.1% à 100000%
      var ZOOM_MIN = 0.001, ZOOM_MAX = 1000;

      function zoomAt(clientX, clientY, factor) {
        var rect = viewport.getBoundingClientRect();
        var sx = clientX - rect.left, sy = clientY - rect.top;
        var worldBefore = { x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom };
        var targetZoom = clamp(camera.zoom * factor, ZOOM_MIN, ZOOM_MAX);
        var targetX = sx - worldBefore.x * targetZoom;
        var targetY = sy - worldBefore.y * targetZoom;
        animateCameraTo({ x: targetX, y: targetY, zoom: targetZoom }, 220);
      }

      // ---------------------------------------------------------------
      // Persistence (localStorage per board)
      // ---------------------------------------------------------------
      function lsKey(boardId) { return 'atelier-v1-board:' + activeBoardId + ':' + boardId; }
      function lsMediaKey(blockId) { return 'atelier-v1-media:' + activeBoardId + ':' + blockId; }

      function metaOf(b) {
        var m = { id: b.id, type: b.type, x: b.x, y: b.y, w: b.w, h: b.h, z: b.z, color: b.color || null };
        if (b.type === 'text') m.text = b.text || '';
        if (b.type === 'link') m.url = b.url || '';
        if (b.type === 'video') m.url = b.url || '';
        if (b.type === 'file') m.filename = b.filename || '';
        if (b.type === 'folder') m.name = b.name || '';
        if (b.hasMedia) m.hasMedia = true;
        return m;
      }

      function scheduleSaveMeta() {
        clearTimeout(saveMetaTimer);
        saveMetaTimer = setTimeout(saveMetaNow, 450);
      }

      // Sauvegarde immédiate (annule le débounce) — utilisé avant tout changement de tableau
      function flushSave() {
        clearTimeout(saveMetaTimer);
        saveMetaNow();
      }

      function saveMetaNow() {
        if (!activeBoardId) return;
        var payload = { blocks: blocks.map(metaOf), camera: camera, maxZ: maxZ, connectors: connectors };
        localBoards[currentBoardId] = payload;
        try {
          localStorage.setItem(lsKey(currentBoardId), JSON.stringify(payload));
        } catch (e) { console.error('save meta error', e); }
      }

      // Récupère le payload d'un tableau sans l'afficher
      function getBoardPayload(boardId) {
        if (localBoards[boardId]) return Promise.resolve(localBoards[boardId]);
        try {
          var raw = localStorage.getItem(lsKey(boardId));
          var p = raw ? JSON.parse(raw) : { blocks: [], camera: null, maxZ: 1 };
          return Promise.resolve(p);
        } catch (e) { return Promise.resolve({ blocks: [], camera: null, maxZ: 1 }); }
      }

      function saveBlockMedia(id, dataUrl) {
        try {
          localStorage.setItem(lsMediaKey(id), dataUrl);
        } catch (e) {
          showToast('Ce fichier est trop volumineux pour être sauvegardé, mais il reste visible dans cette session.');
        }
        return Promise.resolve(null);
      }

      function loadBlockMedia(id) {
        try {
          var v = localStorage.getItem(lsMediaKey(id));
          return Promise.resolve(v || null);
        } catch (e) { return Promise.resolve(null); }
      }

      function deleteBlockMedia(id) {
        try { localStorage.removeItem(lsMediaKey(id)); } catch (e) { }
      }

      // Charge et affiche le tableau `boardId` (racine ou dossier). Suppose que le monde est déjà vide (teardownBoard()).
      function loadBoard(boardId) {
        camera = { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2, zoom: 1 };
        if (localBoards[boardId]) {
          applyPayload(localBoards[boardId]);
          return;
        }
        try {
          var raw = localStorage.getItem(lsKey(boardId));
          if (!raw) { applyCamera(); updateEmptyState(); return; }
          var payload = JSON.parse(raw);
          localBoards[boardId] = payload;
          applyPayload(payload);
        } catch (e) {
          applyCamera();
          updateEmptyState();
        }
      }

      function applyPayload(payload) {
        camera = payload.camera || camera;
        maxZ = payload.maxZ || 1;
        connectors = payload.connectors || [];
        applyCamera();
        var metas = payload.blocks || [];
        metas.forEach(function (m) {
          var b = Object.assign({}, m);
          createBlockDom(b, true);
          if (b.hasMedia) {
            loadBlockMedia(b.id).then(function (data) {
              if (data) setBlockMedia(b, data);
            });
          }
        });
        renderConnectors();
        updateEmptyState();
      }

      // Vide le monde affiché (DOM + état) avant de charger un autre tableau
      function teardownBoard() {
        blocks.forEach(function (bl) {
          if (bl.recorder && bl.recorder.state === 'recording') { try { bl.recorder.stop(); } catch (e) { } }
        });
        blocks = [];
        connectors = [];
        blockEls = {};
        world.innerHTML = '<svg id="connectorsCanvas" style="position:absolute; top:0; left:0; width:1px; height:1px; overflow:visible; pointer-events:none; z-index:5;"></svg>';
        selectedIds = [];
        updateSelectionUI();
        maxZ = 1;
      }

      function updateEmptyState() {
        emptyState.style.display = blocks.length ? 'none' : 'block';
        var big = emptyState.querySelector('.big');
        var small = emptyState.querySelector('.small');
        if (currentBoardId === 'root') {
          big.textContent = 'Ton tableau est vide';
          small.textContent = 'DOUBLE-CLIC QUELQUE PART POUR COMMENCER';
        } else {
          big.textContent = 'Ce dossier est vide';
          small.textContent = 'DOUBLE-CLIC QUELQUE PART POUR AJOUTER UN BLOC';
        }
      }

      // ---------------------------------------------------------------
      // Navigation entre tableaux (dossiers / sous-dossiers)
      // ---------------------------------------------------------------
      function updateBreadcrumb() {
        var home = document.getElementById('crumbHome');
        var trail = document.getElementById('crumbTrail');
        var atRoot = (currentBoardId === 'root');
        home.classList.toggle('current', atRoot);
        trail.innerHTML = '';
        boardStack.forEach(function (entry, i) {
          appendCrumbSep(trail);
          var c = document.createElement('span');
          c.className = 'crumb';
          c.textContent = entry.name || 'Dossier';
          c.title = entry.name || 'Dossier';
          c.addEventListener('click', function () { navigateToBoardIndex(i); });
          trail.appendChild(c);
        });
        if (!atRoot) {
          appendCrumbSep(trail);
          var cur = document.createElement('span');
          cur.className = 'crumb current';
          cur.textContent = currentBoardName || 'Dossier';
          cur.title = currentBoardName || 'Dossier';
          trail.appendChild(cur);
        }
      }
      function appendCrumbSep(trail) {
        var s = document.createElement('span');
        s.className = 'crumb-sep';
        s.textContent = '\u203A';
        trail.appendChild(s);
      }

      function goHome() {
        if (currentBoardId === 'root') return;
        flushSave();
        teardownBoard();
        boardStack = [];
        currentBoardId = 'root';
        currentBoardName = 'Whiteboard';
        loadBoard('root');
        updateBreadcrumb();
        closeAddMenu();
        selectBlock(null);
      }

      function navigateToBoardIndex(i) {
        var target = boardStack[i];
        if (!target || target.id === currentBoardId) return;
        flushSave();
        teardownBoard();
        boardStack = boardStack.slice(0, i);
        currentBoardId = target.id;
        currentBoardName = target.name;
        loadBoard(currentBoardId);
