        updateBreadcrumb();
        closeAddMenu();
        selectBlock(null);
      }

      function openFolder(b) {
        flushSave();
        boardStack.push({ id: currentBoardId, name: currentBoardName });
        teardownBoard();
        currentBoardId = b.id;
        currentBoardName = b.name || 'Dossier';
        loadBoard(currentBoardId);
        updateBreadcrumb();
        closeAddMenu();
        selectBlock(null);
      }

      // ---------------------------------------------------------------
      // Block factory
      // ---------------------------------------------------------------
      var DEFAULT_SIZE = {
        text: { w: 220, h: 170 },
        image: { w: 260, h: 200 },
        drawing: { w: 320, h: 240 },
        voice: { w: 220, h: 150 },
        link: { w: 240, h: 130 },
        video: { w: 300, h: 210 },
        file: { w: 260, h: 160 },
        folder: { w: 200, h: 175 }
      };

      function addBlock(type, worldPos) {
        var size = DEFAULT_SIZE[type] || { w: 220, h: 160 };
        var b = {
          id: uid(),
          type: type,
          x: Math.round(worldPos.x - size.w / 2),
          y: Math.round(worldPos.y - size.h / 2),
          w: size.w,
          h: size.h,
          z: ++maxZ,
          color: type === 'text' ? COLORS[0] : null,
          text: '',
          url: '',
          name: type === 'folder' ? 'Nouveau dossier' : '',
          hasMedia: false
        };
        createBlockDom(b, false);
        updateEmptyState();
        scheduleSaveMeta();
        selectBlock(b.id);
        return b;
      }

      function removeBlock(id) {
        var idx = blocks.findIndex(function (b) { return b.id === id; });
        if (idx === -1) return;
        var b = blocks[idx];
        if (b.recorder && b.recorder.state === 'recording') { try { b.recorder.stop(); } catch (e) { } }
        blocks.splice(idx, 1);
        connectors = connectors.filter(function(c) { return c.fromId !== id && c.toId !== id; });
        renderConnectors();
        var el = blockEls[id];
        delete blockEls[id];
        animateBlockRemoval(el);
        if (b.hasMedia) deleteBlockMedia(id);
        var selIndex = selectedIds.indexOf(id);
        if (selIndex !== -1) selectedIds.splice(selIndex, 1);
        updateSelectionUI();
        updateEmptyState();
        scheduleSaveMeta();
      }

      function duplicateBlock(b) {
        var copy = Object.assign({}, b, { id: uid(), x: b.x + 20, y: b.y + 20, z: ++maxZ });
        if (b.hasMedia) {
          copy.mediaData = b.mediaData;
          copy.hasMedia = true;
        }
        if (b.filename) copy.filename = b.filename;
        if (b.url) copy.url = b.url;
        if (b.text) copy.text = b.text;
        if (b.name) copy.name = b.name;
        createBlockDom(copy, false);
        updateEmptyState();
        scheduleSaveMeta();
        selectBlock(copy.id, false);
        return copy;
      }

      function animateBlockEntry(el) {
        if (!el) return;
        el.classList.add('pop');
        el.addEventListener('animationend', function onEnd() {
          el.removeEventListener('animationend', onEnd);
          el.classList.remove('pop');
        });
      }

      function createBlockParticles(el) {
        if (!el || !el.parentNode) return;
        var rect = { left: parseFloat(el.style.left) || 0, top: parseFloat(el.style.top) || 0, width: parseFloat(el.style.width) || el.offsetWidth, height: parseFloat(el.style.height) || el.offsetHeight };
        var container = document.createElement('div');
        container.className = 'block-particles';
        container.style.left = rect.left + 'px';
        container.style.top = rect.top + 'px';
        container.style.width = rect.width + 'px';
        container.style.height = rect.height + 'px';

        for (var i = 0; i < 8; i++) {
          var p = document.createElement('span');
          p.className = 'particle';
          var angle = (Math.PI * 2 / 8) * i;
          var distance = 32 + Math.random() * 16;
          p.style.setProperty('--dx', Math.round(Math.cos(angle) * distance) + 'px');
          p.style.setProperty('--dy', Math.round(Math.sin(angle) * distance) + 'px');
          p.style.left = '50%';
          p.style.top = '50%';
          p.style.background = ['#3A5A78', '#8AA88F', '#C97B67', '#D8A24A', '#8E7CB0', '#B4924A'][i % 6];
          container.appendChild(p);
        }

        world.appendChild(container);
        setTimeout(function () {
          if (container.parentNode) container.parentNode.removeChild(container);
        }, 380);
      }

      function animateBlockRemoval(el, callback) {
        if (!el) {
          if (callback) callback();
          return;
        }
        createBlockParticles(el);
        var done = false;
        function finish() {
          if (done) return;
          done = true;
          if (el.parentNode) el.parentNode.removeChild(el);
          if (callback) callback();
        }
        el.addEventListener('animationend', function onEnd(e) {
          if (e.animationName === 'blockFade') {
            el.removeEventListener('animationend', onEnd);
            finish();
          }
        });
        el.classList.add('leaving');
        setTimeout(finish, 280);
      }

      // Retire un bloc du tableau courant SANS supprimer son média (il continue d'exister,
      // rangé dans un dossier ailleurs). Utilisé par le glisser-déposer vers un dossier.
      function removeBlockLocal(id) {
        var idx = blocks.findIndex(function (x) { return x.id === id; });
        if (idx === -1) return;
        var bl = blocks[idx];
        if (bl.recorder && bl.recorder.state === 'recording') { try { bl.recorder.stop(); } catch (e) { } }
        blocks.splice(idx, 1);
        var el = blockEls[id];
        delete blockEls[id];
        animateBlockRemoval(el);
        var selIndex = selectedIds.indexOf(id);
        if (selIndex !== -1) selectedIds.splice(selIndex, 1);
        updateSelectionUI();
        updateEmptyState();
      }

      // Déplace un bloc existant (b) à l'intérieur du dossier dont l'id est folderId.
      // Fonctionne même si ce dossier n'est pas ouvert : on modifie directement son payload persisté.
      function fileBlockIntoFolder(b, folderId, folderName) {
        removeBlockLocal(b.id);
        flushSave();
        getBoardPayload(folderId).then(function (payload) {
          payload.blocks = payload.blocks || [];
          payload.maxZ = (payload.maxZ || 1) + 1;
          var meta = metaOf(b);
          meta.x = Math.round(40 + Math.random() * 140);
          meta.y = Math.round(40 + Math.random() * 140);
          meta.z = payload.maxZ;
          payload.blocks.push(meta);
          if (!payload.camera) payload.camera = { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2, zoom: 1 };
          localBoards[folderId] = payload;
        try { localStorage.setItem(lsKey(folderId), JSON.stringify(payload)); } catch (e) { }
          showToast('Bloc rangé dans « ' + (folderName || 'Dossier') + ' ».');
        });
      }

      function isSelected(id) {
        return selectedIds.indexOf(id) !== -1;
      }

      function updateSelectionUI() {
        Object.keys(blockEls).forEach(function (id) {
          blockEls[id].classList.toggle('selected', isSelected(id));
        });
        if (btnDeleteSelected) btnDeleteSelected.disabled = !selectedIds.length && !selectedConnectorIds.length;
        if (btnGroupSelected) btnGroupSelected.disabled = selectedIds.length < 2;

        renderConnectors();

        var totalSelected = selectedIds.length + selectedConnectorIds.length;
        if (selectionLabel) {
          selectionLabel.textContent = totalSelected
            ? totalSelected + ' élément' + (totalSelected > 1 ? 's' : '') + ' sélectionné' + (totalSelected > 1 ? 's' : '')
            : '';
        }
      }

      function toggleBlockSelection(id) {
        var idx = selectedIds.indexOf(id);
        if (idx === -1) selectedIds.push(id);
        else selectedIds.splice(idx, 1);
        updateSelectionUI();
      }

      function selectBlock(id, additive) {
        if (!id) {
          selectedIds = [];
          selectedConnectorIds = [];
          updateSelectionUI();
          return;
        }
        if (additive) {
          toggleBlockSelection(id);
          return;
        }
        selectedIds = [id];
        selectedConnectorIds = [];
        updateSelectionUI();
      }

      function removeSelectedBlocks() {
        if (!selectedIds.length && !selectedConnectorIds.length) return;
        var removedB = selectedIds.slice();
        var removedC = selectedConnectorIds.slice();
        selectedIds = [];
        selectedConnectorIds = [];
        removedB.forEach(function (id) { removeBlock(id); });
        removedC.forEach(function (id) { removeConnector(id); });
        updateSelectionUI();
      }

      function groupSelectedBlocks() {
        if (selectedIds.length < 2) return;
        var selected = blocks.filter(function (b) { return selectedIds.indexOf(b.id) !== -1; });
        if (!selected.length) return;
        var minX = selected[0].x, minY = selected[0].y;
        var maxX = selected[0].x + selected[0].w, maxY = selected[0].y + selected[0].h;
        selected.forEach(function (b) {
          minX = Math.min(minX, b.x);
          minY = Math.min(minY, b.y);
          maxX = Math.max(maxX, b.x + b.w);
          maxY = Math.max(maxY, b.y + b.h);
        });
        var folderWidth = Math.max(220, Math.round(maxX - minX + 60));
        var folderHeight = Math.max(175, Math.round(maxY - minY + 60));
        var folder = {
          id: uid(),
          type: 'folder',
          x: minX,
          y: minY,
          w: folderWidth,
          h: folderHeight,
          z: ++maxZ,
          color: COLORS[0],
          name: 'Groupe'
        };
        var payload = { blocks: [], camera: { x: folderWidth / 2, y: folderHeight / 2, zoom: 1 }, maxZ: 0 };
        selected.forEach(function (b) {
          var meta = metaOf(b);
          meta.x = Math.round(b.x - minX + 40);
          meta.y = Math.round(b.y - minY + 40);
          payload.blocks.push(meta);
          payload.maxZ = Math.max(payload.maxZ, meta.z || 1);
        });
        if (payload.maxZ < 1) payload.maxZ = selected.length;
        localBoards[folder.id] = payload;
        try { localStorage.setItem(lsKey(folder.id), JSON.stringify(payload)); } catch (e) { }
        selectedIds.slice().forEach(removeBlockLocal);
        createBlockDom(folder, false);
        updateEmptyState();
        scheduleSaveMeta();
        selectBlock(folder.id);
        showToast('Sélection groupée dans un dossier.');
      }

      function bringToFront(b) {
        b.z = ++maxZ;
        if (blockEls[b.id]) blockEls[b.id].style.zIndex = b.z;
      }

      // ---------------------------------------------------------------
      // DOM construction per type
      // ---------------------------------------------------------------
      var TYPE_LABEL = { text: 'Note', image: 'Image', drawing: 'Dessin', voice: 'Vocal', link: 'Lien', video: 'Vidéo', file: 'Fichier', folder: 'Dossier' };

      function createBlockDom(b, fromLoad) {
        blocks.push(b);
        var el = document.createElement('div');
        el.className = 'block';
        el.style.left = b.x + 'px';
        el.style.top = b.y + 'px';
        el.style.width = b.w + 'px';
        el.style.height = b.h + 'px';
        el.style.zIndex = b.z;
        el.dataset.id = b.id;

        var bar = document.createElement('div');
        bar.className = 'block-bar';
        var dot = document.createElement('span');
        dot.className = 'block-dot';
        dot.style.background = DOT_COLORS[['text', 'image', 'drawing', 'voice', 'link', 'video', 'folder'].indexOf(b.type)] || '#999';
        var label = document.createElement('span');
        label.className = 'block-type-label';
        label.textContent = TYPE_LABEL[b.type] || b.type;

        var closeBtn = document.createElement('button');
        closeBtn.className = 'block-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Supprimer';
        closeBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          removeBlock(b.id);
        });
        bar.appendChild(dot); bar.appendChild(label); bar.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'block-body';

        el.appendChild(bar);
        el.appendChild(body);

        var resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        el.appendChild(resizeHandle);

        world.appendChild(el);
        blockEls[b.id] = el;
        if (!fromLoad) {
          animateBlockEntry(el);
        }

        attachDrag(el, el, b);
        attachResize(el, resizeHandle, b, body);
        el.addEventListener('pointerdown', function (e) {
          if (e.button === 2) { // Right click for Maltego connector
            e.preventDefault();
            e.stopPropagation();
            startMaltegoConnection(b, e);
            return;
          }
        }, true);
        el.addEventListener('contextmenu', function(e) {
          e.preventDefault(); // prevent native menu on blocks
        });

        buildBody(b, body, el);
        return el;
      }

      function buildBody(b, body, el) {
        body.innerHTML = '';
        if (b.type === 'text') buildText(b, body);
        else if (b.type === 'image') buildImage(b, body);
        else if (b.type === 'drawing') buildDrawing(b, body);
        else if (b.type === 'voice') buildVoice(b, body);
        else if (b.type === 'link') buildLink(b, body);
        else if (b.type === 'video') buildVideo(b, body);
        else if (b.type === 'file') buildFile(b, body);
        else if (b.type === 'folder') buildFolder(b, body);
      }

      // ----- text -----
      function buildText(b, body) {
        var editable = document.createElement('div');
        editable.className = 'text-content';
        editable.contentEditable = 'true';
        editable.setAttribute('data-placeholder', 'Écris quelque chose…');
        editable.innerHTML = b.text || '';
        editable.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        editable.addEventListener('input', function () {
          b.text = editable.innerHTML;
          scheduleSaveMeta();
        });
        editable.addEventListener('click', function(e) {
          if (e.target && e.target.type === 'checkbox') {
            if (e.target.checked) e.target.setAttribute('checked', 'checked');
            else e.target.removeAttribute('checked');
            b.text = editable.innerHTML;
            scheduleSaveMeta();
          }
        });
        body.appendChild(editable);

        var fmtRow = document.createElement('div');
        fmtRow.className = 'fmt-row';

        var btnB = document.createElement('button');
        btnB.className = 'fmt-btn';
        btnB.innerHTML = '<b>B</b>';
        btnB.title = 'Gras';
        btnB.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
        btnB.addEventListener('click', function(e) {
          e.stopPropagation();
          editable.focus();
          document.execCommand('bold', false, null);
        });

        var btnI = document.createElement('button');
        btnI.className = 'fmt-btn';
        btnI.innerHTML = '<i>I</i>';
        btnI.title = 'Italique';
        btnI.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
        btnI.addEventListener('click', function(e) {
          e.stopPropagation();
          editable.focus();
          document.execCommand('italic', false, null);
        });

        var btnList = document.createElement('button');
        btnList.className = 'fmt-btn';
        btnList.innerHTML = '• Liste';
        btnList.title = 'Liste à puces';
        btnList.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
        btnList.addEventListener('click', function(e) {
          e.stopPropagation();
          editable.focus();
          document.execCommand('insertUnorderedList', false, null);
        });

        var btnTodo = document.createElement('button');
        btnTodo.className = 'fmt-btn';
        btnTodo.innerHTML = '☑ Todo';
        btnTodo.title = 'Ajouter une case à cocher';
        btnTodo.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
        btnTodo.addEventListener('click', function(e) {
          e.stopPropagation();
          editable.focus();
          var checkboxHtml = '<div style="margin:2px 0;"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;" contenteditable="false"><input type="checkbox"/> <span contenteditable="true">Tâche</span></label></div>';
          document.execCommand('insertHTML', false, checkboxHtml);
        });

        fmtRow.appendChild(btnB);
        fmtRow.appendChild(btnI);
        fmtRow.appendChild(btnList);
        fmtRow.appendChild(btnTodo);
        body.appendChild(fmtRow);

        var row = document.createElement('div');
        row.className = 'color-row';
        COLORS.forEach(function (c) {
          var sw = document.createElement('span');
          sw.className = 'swatch' + (b.color === c ? ' active' : '');
          sw.style.background = c;
          sw.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
          sw.addEventListener('click', function (e) {
            e.stopPropagation();
            b.color = c;
            blockEls[b.id].style.background = c;

      // ----- drawing -----
      var DRAW_COLORS = ['#2B2B2B', '#B4543D', '#3A5A78', '#8AA88F', '#D8A24A'];

      function buildDrawing(b, body) {
        var toolbar = document.createElement('div');

        DRAW_COLORS.forEach(function (c, i) {
          var sw = document.createElement('span');
          sw.className = 'draw-swatch' + (i === 0 ? ' active' : '');
          sw.style.background = c;
          sw.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

        var clearBtn = document.createElement('button');

          e.stopPropagation();

          persistDrawing();
        });
        toolbar.appendChild(clearBtn);

        var canvas = document.createElement('canvas');
        canvas.className = 'drawing-canvas';
        canvas.width = Math.round(b.w);

        body.appendChild(canvas);

        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2.6;

        if (b.mediaData) {
          var img = new Image();
          img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
          img.src = b.mediaData;
        }

        var last = null;
        canvas.addEventListener('pointerdown', function (e) {
          e.stopPropagation();
          canvas.setPointerCapture(e.pointerId);
          state.drawing = true;
          var r = canvas.getBoundingClientRect();
          last = { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
          ctx.beginPath();
          ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
          ctx.fillStyle = state.color;
          ctx.fill();
        });
        canvas.addEventListener('pointermove', function (e) {
          if (!state.drawing) return;
          e.stopPropagation();
          var r = canvas.getBoundingClientRect();
          var pt = { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
          ctx.strokeStyle = state.color;
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();
          last = pt;
        });
        function endStroke(e) {
          if (!state.drawing) return;
          state.drawing = false;
          last = null;
          persistDrawing();
        }
        canvas.addEventListener('pointerup', endStroke);
        canvas.addEventListener('pointercancel', endStroke);
        canvas.addEventListener('pointerleave', function (e) { if (state.drawing && e.buttons === 0) endStroke(e); });

        function persistDrawing() {
          try {
            var dataUrl = canvas.toDataURL('image/png');
            setBlockMedia(b, dataUrl, true);
          } catch (e) { console.error('drawing export failed', e); }
        }
      }

      // ----- voice -----

      function renderVoiceState(b, body) {
        body.innerHTML = '';

        var btn = document.createElement('button');

        var chunks = [];
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (btn.classList.contains('recording')) {
            if (b.recorder) b.recorder.stop();
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast("Ton navigateur ne permet pas l'enregistrement audio ici.");
            return;
          }
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            chunks = [];
            var mime = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) ? 'audio/webm' : '';
            var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
            b.recorder = rec;
            rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
            rec.onstop = function () {
              stream.getTracks().forEach(function (t) { t.stop(); });
              btn.classList.remove('recording');
              lbl.textContent = 'Traitement…';
              var blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
              var reader = new FileReader();
              reader.onload = function () {
                setBlockMedia(b, reader.result);
                renderVoiceState(b, body);
              };
              reader.readAsDataURL(blob);
            };
            rec.start();
            btn.classList.add('recording');
            lbl.textContent = 'Enregistrement… (clic pour arrêter)';
          }).catch(function (err) {
            console.error(err);
            showToast('Micro non disponible : ' + (err && err.message ? err.message : 'permission refusée'));
          });
        });

        body.appendChild(btn);
        body.appendChild(lbl);
      }

      // ----- link -----

      function normalizeUrl(u) {

      function renderLinkState(b, body) {

      function youTubeEmbed(u) {
        // Handles: youtu.be/ID, youtube.com/watch?v=ID, /watch?...&v=ID, /shorts/ID, /embed/ID, /v/ID, m.youtube.com
        var m = u.match(/(?:youtu\.be\/|(?:www\.|m\.)?youtube\.com\/(?:watch\?(?:.*[?&])?v=|embed\/|shorts\/|v\/))([A-Za-z0-9_-]{10,12})/);
        return m ? 'https://www.youtube.com/embed/' + m[1] + '?rel=0&modestbranding=1' : null;
      }
      function vimeoEmbed(u) {
        var m = u.match(/(?:vimeo\.com\/(?:video\/)?)(\d+)/);
        return m ? 'https://player.vimeo.com/video/' + m[1] + '?byline=0&portrait=0' : null;
      }

      // ----- shared media setter -----
      function setBlockMedia(b, dataUrl, skipRebuildIfDrawing) {
        b.mediaData = dataUrl;
        b.hasMedia = true;
        saveBlockMedia(b.id, dataUrl);
        scheduleSaveMeta();
        var el = blockEls[b.id];
        if (!el) return;
        var body = el.querySelector('.block-body');
        if (!body) return;
        if (b.type === 'image') renderImageContent(b, body);
        else if (b.type === 'voice') renderVoiceState(b, body);
        else if (b.type === 'video') renderVideoState(b, body);

      }

      // ---------------------------------------------------------------
      // Drag & resize
      // ---------------------------------------------------------------
      // Cherche un bloc de type dossier sous un point écran (hors excludeId). Utilisé pour le glisser-déposer.
      function findFolderUnderPoint(clientX, clientY, excludeId) {
        for (var i = blocks.length - 1; i >= 0; i--) {
          var fb = blocks[i];
          if (fb.type !== 'folder' || fb.id === excludeId) continue;
          var el2 = blockEls[fb.id];
          if (!el2) continue;
          var r = el2.getBoundingClientRect();
          if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) return el2;
        }
        return null;
      }

      function attachDrag(el, handle, b) {
        var dragging = false, startX = 0, startY = 0, origX = 0, origY = 0, hoverFolder = null;
        var dragSelection = [];
        var groupDrag = false;
        var hasMoved = false;
        var wasSelectedOnDown = false;
        var additiveOnDown = false;

        el.addEventListener('pointerdown', function (e) {
          if (e.button !== 0) return;
          if (e.target.closest('.block-close') ||
              e.target.closest('.resize-handle') ||
              e.target.closest('.fmt-btn') ||
              e.target.closest('.file-replace') ||
              e.target.closest('.folder-open') ||
              e.target.closest('input') ||
              e.target.closest('a')) return;

          if (e.target.isContentEditable && document.activeElement === e.target && !isSelected(b.id)) return;

          e.stopPropagation();
          dragging = true;
          hasMoved = false;
          try { el.setPointerCapture(e.pointerId); } catch (err) {}

          startX = e.clientX; startY = e.clientY;
          origX = b.x; origY = b.y;
          el.classList.add('dragging');
          bringToFront(b);

          wasSelectedOnDown = isSelected(b.id);
          additiveOnDown = e.ctrlKey || e.metaKey || e.shiftKey;

          if (additiveOnDown) {
            selectBlock(b.id, true);
          } else if (!wasSelectedOnDown) {
            selectBlock(b.id, false);
          }

          dragSelection = selectedIds.map(function (id) {
            var block = blocks.find(function (x) { return x.id === id; });
            return block ? { id: id, x: block.x, y: block.y } : null;
          }).filter(Boolean);

          groupDrag = dragSelection.length > 1;
        });

        el.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          var dx = (e.clientX - startX) / camera.zoom;
          var dy = (e.clientY - startY) / camera.zoom;
          if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) {
            hasMoved = true;
          }
          if (groupDrag) {
            dragSelection.forEach(function (item) {
              var block = blocks.find(function (x) { return x.id === item.id; });
              if (!block) return;
              block.x = item.x + dx;
              block.y = item.y + dy;
              var el2 = blockEls[item.id];
              if (el2) {
                el2.style.left = block.x + 'px';
                el2.style.top = block.y + 'px';
              }
            });
            if (hoverFolder) {
              hoverFolder.classList.remove('drop-target');
              hoverFolder = null;
            }
          } else {
            b.x = origX + dx;
            b.y = origY + dy;
            el.style.left = b.x + 'px';
            el.style.top = b.y + 'px';
            var fEl = findFolderUnderPoint(e.clientX, e.clientY, b.id);
            if (fEl !== hoverFolder) {
              if (hoverFolder) hoverFolder.classList.remove('drop-target');
              hoverFolder = fEl;
              if (hoverFolder) hoverFolder.classList.add('drop-target');
            }
          }
          renderConnectors();
        });

        function stop(e) {
          if (!dragging) return;
          dragging = false;
          el.classList.remove('dragging');
          renderConnectors();
          
          if (wasSelectedOnDown && !hasMoved && !additiveOnDown && e.type === 'pointerup') {
            selectBlock(b.id, false);
          }

          if (!groupDrag && hoverFolder) {
            hoverFolder.classList.remove('drop-target');
            var folderId = hoverFolder.dataset.id;
            var fb = blocks.find(function (x) { return x.id === folderId; });
            hoverFolder = null;
            if (folderId && folderId !== b.id) {
              fileBlockIntoFolder(b, folderId, fb ? fb.name : null);
              return;
            }
          }
          scheduleSaveMeta();
        }

        el.addEventListener('pointerup', stop);
        el.addEventListener('pointercancel', stop);
      }

      function attachResize(el, handle, b, body) {
        var resizing = false, startX = 0, startY = 0, origW = 0, origH = 0;
        var MIN_W = 160, MIN_H = 110;
        handle.addEventListener('pointerdown', function (e) {
          e.stopPropagation();
          resizing = true;
          handle.setPointerCapture(e.pointerId);
          startX = e.clientX; startY = e.clientY;
          origW = b.w; origH = b.h;
          el.classList.add('resizing');
          bringToFront(b);
        });
        handle.addEventListener('pointermove', function (e) {
          if (!resizing) return;
          var dx = (e.clientX - startX) / camera.zoom;
          var dy = (e.clientY - startY) / camera.zoom;
          b.w = Math.max(MIN_W, origW + dx);
          b.h = Math.max(MIN_H, origH + dy);
          el.style.width = b.w + 'px';
          el.style.height = b.h + 'px';
          renderConnectors();
        });
        function stop() {
          if (!resizing) return;
          resizing = false;
          el.classList.remove('resizing');
          renderConnectors();
          scheduleSaveMeta();
        }
        handle.addEventListener('pointerup', stop);
        handle.addEventListener('pointercancel', stop);
      }

      // ---------------------------------------------------------------
      // Add-menu (double click)
      // ---------------------------------------------------------------
      var mainEl = document.getElementById('main');
      var addMenu = document.getElementById('addMenu');
      var addPin = document.getElementById('addPin');
      var pendingWorldPos = null;

      function openAddMenu(clientX, clientY, worldPos) {
        pendingWorldPos = worldPos;
        var mainRect = mainEl.getBoundingClientRect();
        var relX = clientX - mainRect.left;
        var relY = clientY - mainRect.top;
        var menuW = 200, menuH = 205;
        var left = clamp(relX, 8, mainRect.width - menuW - 8);
        var top = clamp(relY, 8, mainRect.height - menuH - 8);
        addMenu.style.left = left + 'px';
        addMenu.style.top = top + 'px';
        addMenu.classList.add('open');
        addPin.style.left = (relX - 4) + 'px';
        addPin.style.top = (relY - 4) + 'px';
        addPin.classList.add('open');
      }
      function closeAddMenu() {
        addMenu.classList.remove('open');
        addPin.classList.remove('open');
        pendingWorldPos = null;
      }
      addMenu.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      addMenu.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-type]');
        if (!btn) return;
        var type = btn.getAttribute('data-type');
        var pos = pendingWorldPos || screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
        addBlock(type, pos);
        closeAddMenu();
      });

      // ---------------------------------------------------------------
      // Viewport interactions: pan, zoom, right-click marquee selection & glide
      // ---------------------------------------------------------------
      var panState = { active: false, startX: 0, startY: 0, camX: 0, camY: 0, moved: false };
      var selectionMarquee = document.getElementById('selectionMarquee');
      var rightSelectState = { active: false, startX: 0, startY: 0, initialSelected: [], moved: false };

      var glideAnimation = null;
      var panHistory = [];

      function cancelGlideAnimation() {
        if (glideAnimation) {
          cancelAnimationFrame(glideAnimation);
          glideAnimation = null;
        }
      }

      function startGlide(vx, vy) {
        cancelGlideAnimation();
        var friction = 0.90; // Subtle, elegant deceleration
        var lastTime = performance.now();

        function glideStep(now) {
          var delta = Math.min(32, now - lastTime);
          lastTime = now;

          var frameRatio = delta / 16.6;
          camera.x += vx * 11 * frameRatio;
          camera.y += vy * 11 * frameRatio;

          vx *= Math.pow(friction, frameRatio);
          vy *= Math.pow(friction, frameRatio);

          applyCamera();

          if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01) {
            glideAnimation = requestAnimationFrame(glideStep);
          } else {
            glideAnimation = null;
            scheduleSaveMeta();
          }
        }

        glideAnimation = requestAnimationFrame(glideStep);
      }

      // Disable default browser context menu on viewport for clean right-click dragging
      viewport.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });

      viewport.addEventListener('pointerdown', function (e) {
        cancelGlideAnimation();
        cancelCameraAnimation();

        // Right-click drag selection marquee (Windows Desktop style)
        if (e.button === 2) {
          e.preventDefault();
          e.stopPropagation();
          closeAddMenu();

          var additive = e.ctrlKey || e.metaKey || e.shiftKey;
          var baseSelection = additive ? selectedIds.slice() : [];

          rightSelectState.active = true;
          rightSelectState.moved = false;
          rightSelectState.startX = e.clientX;
          rightSelectState.startY = e.clientY;
          rightSelectState.initialSelected = baseSelection;
          rightSelectState.initialSelectedConnectors = additive ? selectedConnectorIds.slice() : [];

          if (!additive) {
            selectedIds = [];
            selectedConnectorIds = [];
            updateSelectionUI();
          }

          try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
          return;
        }

        if (e.target.closest('.block')) return;
        closeAddMenu();
        selectBlock(null);
        panState.active = true;
        panState.moved = false;
        panState.startX = e.clientX; panState.startY = e.clientY;
        panState.camX = camera.x; panState.camY = camera.y;
        panHistory = [{ x: e.clientX, y: e.clientY, time: performance.now() }];
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add('panning');
      });

      viewport.addEventListener('pointermove', function (e) {
        if (rightSelectState.active) {
          var dx = e.clientX - rightSelectState.startX;
          var dy = e.clientY - rightSelectState.startY;

          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            rightSelectState.moved = true;
          }

          var vRect = viewport.getBoundingClientRect();
          var sMinX = Math.min(rightSelectState.startX, e.clientX) - vRect.left;
          var sMinY = Math.min(rightSelectState.startY, e.clientY) - vRect.top;
          var sMaxX = Math.max(rightSelectState.startX, e.clientX) - vRect.left;
          var sMaxY = Math.max(rightSelectState.startY, e.clientY) - vRect.top;

          selectionMarquee.style.left = sMinX + 'px';
          selectionMarquee.style.top = sMinY + 'px';
          selectionMarquee.style.width = (sMaxX - sMinX) + 'px';
          selectionMarquee.style.height = (sMaxY - sMinY) + 'px';
          selectionMarquee.style.display = 'block';

          // Convert screen coordinates to world coordinates
          var w1 = screenToWorld(Math.min(rightSelectState.startX, e.clientX), Math.min(rightSelectState.startY, e.clientY));
          var w2 = screenToWorld(Math.max(rightSelectState.startX, e.clientX), Math.max(rightSelectState.startY, e.clientY));

          var wMinX = Math.min(w1.x, w2.x);
          var wMinY = Math.min(w1.y, w2.y);
          var wMaxX = Math.max(w1.x, w2.x);
          var wMaxY = Math.max(w1.y, w2.y);

          // Find intersecting blocks
          var intersected = blocks.filter(function (b) {
            var bw = b.w || 200;
            var bh = b.h || 150;
            return (b.x < wMaxX && (b.x + bw) > wMinX && b.y < wMaxY && (b.y + bh) > wMinY);
          }).map(function (b) { return b.id; });

          // Find intersecting connectors
          var intersectedConnectors = connectors.filter(function (c) {
            var b1 = blocks.find(function(x) { return x.id === c.fromId; });
            var b2 = blocks.find(function(x) { return x.id === c.toId; });
            if (!b1 || !b2) return false;

            var c1x = b1.x + b1.w / 2, c1y = b1.y + b1.h / 2;
            var c2x = b2.x + b2.w / 2, c2y = b2.y + b2.h / 2;

            var minCx = Math.min(c1x, c2x), maxCx = Math.max(c1x, c2x);
            var minCy = Math.min(c1y, c2y), maxCy = Math.max(c1y, c2y);

            var lineIntersects = (minCx <= wMaxX && maxCx >= wMinX && minCy <= wMaxY && maxCy >= wMinY);
            return lineIntersects || (intersected.indexOf(c.fromId) !== -1 && intersected.indexOf(c.toId) !== -1);
          }).map(function (c) { return c.id; });

          // Merge with initial selected if Ctrl / Shift key was down
          var combined = rightSelectState.initialSelected.slice();
          intersected.forEach(function (id) {
            if (combined.indexOf(id) === -1) combined.push(id);
          });

          var combinedConn = rightSelectState.initialSelectedConnectors ? rightSelectState.initialSelectedConnectors.slice() : [];
          intersectedConnectors.forEach(function (id) {
            if (combinedConn.indexOf(id) === -1) combinedConn.push(id);
          });

          selectedIds = combined;
          selectedConnectorIds = combinedConn;
          updateSelectionUI();
          return;
        }

        if (!panState.active) return;
        var dx = e.clientX - panState.startX, dy = e.clientY - panState.startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panState.moved = true;
        camera.x = panState.camX + dx;
        camera.y = panState.camY + dy;
        applyCamera();

        var now = performance.now();
        panHistory.push({ x: e.clientX, y: e.clientY, time: now });
        while (panHistory.length > 0 && (now - panHistory[0].time) > 100) {
          panHistory.shift();
        }
      });

      function endPan(e) {
        if (rightSelectState.active) {
          rightSelectState.active = false;
          selectionMarquee.style.display = 'none';
          return;
        }

        if (!panState.active) return;
        panState.active = false;
        viewport.classList.remove('panning');

        if (panState.moved) {
          var now = performance.now();
          while (panHistory.length > 0 && (now - panHistory[0].time) > 100) {
            panHistory.shift();
          }
          if (panHistory.length >= 2) {
            var first = panHistory[0];
            var last = panHistory[panHistory.length - 1];
            var dt = last.time - first.time;
            if (dt > 8 && dt < 120) {
              var vx = (last.x - first.x) / dt;
              var vy = (last.y - first.y) / dt;
              var speed = Math.sqrt(vx * vx + vy * vy);
              if (speed > 0.12) {
                var maxSpeed = 1.1;
                if (speed > maxSpeed) {
                  vx = (vx / speed) * maxSpeed;
                  vy = (vy / speed) * maxSpeed;
                }
                startGlide(vx, vy);
                return;
              }
            }
          }
          scheduleSaveMeta();
        }
      }
      viewport.addEventListener('pointerup', endPan);
      viewport.addEventListener('pointercancel', endPan);

      viewport.addEventListener('dblclick', function (e) {
        if (e.target.closest('.block')) return;
        var pos = screenToWorld(e.clientX, e.clientY);
        openAddMenu(e.clientX, e.clientY, pos);
      });

      viewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        var factor = Math.exp(-e.deltaY * 0.0024);
        zoomAt(e.clientX, e.clientY, factor);
        scheduleSaveMeta();
      }, { passive: false });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeAddMenu(); selectBlock(null); }
        if ((e.key === 'Delete' || e.key === 'Backspace') && (selectedIds.length || selectedConnectorIds.length)) {
          var active = document.activeElement;
          var isEditing = active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
          if (!isEditing) { e.preventDefault(); removeSelectedBlocks(); }
        }
      });

      function resetViewToFitBlocks() {
        if (!blocks || blocks.length === 0) {
          animateCameraTo({ x: viewport.clientWidth / 2, y: viewport.clientHeight / 2, zoom: 1 }, 220);
          return;
        }

        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        blocks.forEach(function (b) {
          var bx = b.x || 0;
          var by = b.y || 0;
          var bw = b.w || 200;
          var bh = b.h || 150;
          if (bx < minX) minX = bx;
          if (by < minY) minY = by;
          if (bx + bw > maxX) maxX = bx + bw;
          if (by + bh > maxY) maxY = by + bh;
        });

        var padding = 70;
        var bboxW = (maxX - minX) + padding * 2;
        var bboxH = (maxY - minY) + padding * 2;

        var viewW = viewport.clientWidth || window.innerWidth;
        var viewH = viewport.clientHeight || window.innerHeight;

        var zoomX = viewW / bboxW;
        var zoomY = viewH / bboxH;
        var targetZoom = Math.min(zoomX, zoomY);

        // Comfortably cap maximum zoom to 1.1 so single blocks don't get oversized
        targetZoom = Math.max(0.01, Math.min(1.1, targetZoom));

        var centerX = (minX + maxX) / 2;
        var centerY = (minY + maxY) / 2;

        var targetX = viewW / 2 - centerX * targetZoom;
        var targetY = viewH / 2 - centerY * targetZoom;

        animateCameraTo({ x: targetX, y: targetY, zoom: targetZoom }, 280);
      }

      var ZOOM_STEPS = [0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 8.0, 10.0];

      function zoomToNextStep(direction) {
        var cur = camera.zoom;
        var targetZoom = cur;
        if (direction === 'in') {
          for (var i = 0; i < ZOOM_STEPS.length; i++) {
            if (ZOOM_STEPS[i] > cur + 0.005) {
              targetZoom = ZOOM_STEPS[i];
              break;
            }
          }
          if (targetZoom === cur) targetZoom = Math.min(10.0, Math.round((cur * 1.25) * 10) / 10);
        } else {
          for (var j = ZOOM_STEPS.length - 1; j >= 0; j--) {
            if (ZOOM_STEPS[j] < cur - 0.005) {
              targetZoom = ZOOM_STEPS[j];
              break;
            }
          }
          if (targetZoom === cur) targetZoom = Math.max(0.05, Math.round((cur / 1.25) * 10) / 10);
        }

        zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, targetZoom / cur);
        scheduleSaveMeta();
      }

      document.getElementById('btnZoomIn').addEventListener('click', function () {
        zoomToNextStep('in');
      });
      document.getElementById('btnZoomOut').addEventListener('click', function () {
        zoomToNextStep('out');
      });
      document.getElementById('btnZoomReset').addEventListener('click', function () {
        resetViewToFitBlocks();
        scheduleSaveMeta();
      });
      var btnAdd = document.getElementById('btnAdd');
      if (btnAdd) {
        btnAdd.addEventListener('click', function () {
          var mainRect = mainEl.getBoundingClientRect();
          var cx = mainRect.left + mainRect.width / 2;
          var cy = mainRect.top + mainRect.height / 2;
          openAddMenu(cx, cy, screenToWorld(cx, cy));
        });
      }
      var btnGroupSelected = document.getElementById('btnGroupSelected');
      if (btnGroupSelected) {
        btnGroupSelected.addEventListener('click', function () {
          groupSelectedBlocks();
        });
      }
      var btnDeleteSelected = document.getElementById('btnDeleteSelected');
      if (btnDeleteSelected) {
        btnDeleteSelected.addEventListener('click', function () {
          if (!selectedIds.length) return;
          if (!window.confirm('Supprimer les blocs sélectionnés ?')) return;
          removeSelectedBlocks();
        });
      }
      // ---------------------------------------------------------------
      // Event listeners for Search & Bookmarks UI
      // ---------------------------------------------------------------
      var btnSearchToggle = document.getElementById('btnSearchToggle');
      if (btnSearchToggle) {
        btnSearchToggle.addEventListener('click', function() {
          var box = document.getElementById('searchBox');
          if (box.classList.contains('open')) closeSearch();
          else openSearch();
        });
      }
      var searchClose = document.getElementById('searchClose');
      if (searchClose) searchClose.addEventListener('click', closeSearch);

      var searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          performSearch(e.target.value);
        });
        searchInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            if (e.shiftKey) focusSearchResult(searchMatchIdx - 1);
            else focusSearchResult(searchMatchIdx + 1);
          }
          if (e.key === 'Escape') closeSearch();
        });
      }
      var searchPrev = document.getElementById('searchPrev');
      if (searchPrev) searchPrev.addEventListener('click', function() { focusSearchResult(searchMatchIdx - 1); });
      var searchNext = document.getElementById('searchNext');
      if (searchNext) searchNext.addEventListener('click', function() { focusSearchResult(searchMatchIdx + 1); });

      var btnBookmarkToggle = document.getElementById('btnBookmarkToggle');
      if (btnBookmarkToggle) {
        btnBookmarkToggle.addEventListener('click', function() {
          document.getElementById('bookmarkMenu').classList.toggle('open');
        });
      }
      var btnAddBookmark = document.getElementById('btnAddBookmark');
      if (btnAddBookmark) btnAddBookmark.addEventListener('click', addCurrentViewBookmark);

      // Global shortcuts
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          openSearch();
        }
      });

      // ---------------------------------------------------------------
      // Init
      // ---------------------------------------------------------------
      document.getElementById('crumbHome').addEventListener('click', function () {
        if (currentBoardId !== 'root') goHome();
      });

      // Init multi-board sidebar
      (function initBoards() {
        var list = getBoardsIndex();
        if (list.length === 0) {
          var board = createNewBoard('Tableau 1');
          activeBoardId = board.id;
        } else {
          var saved = localStorage.getItem(ACTIVE_BOARD_KEY);
          var found = list.find(function (x) { return x.id === saved; });
          activeBoardId = found ? saved : list[0].id;
        }
        localStorage.setItem(ACTIVE_BOARD_KEY, activeBoardId);
        var allBoards = getBoardsIndex();
        var activeBoard = allBoards.find(function (x) { return x.id === activeBoardId; });
        currentBoardName = activeBoard ? activeBoard.name : 'Whiteboard';
        renderSidebar();
        camera = { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2, zoom: 1 };
        applyCamera();
        loadBoard(currentBoardId);
        updateBreadcrumb();
      })();

      // ═══════════════════════════════════════════════════════════
      // End of application setup
      (function autoConnect() {
      
      var btnThemeToggle = document.getElementById('btnThemeToggle');
      if (btnThemeToggle) {
        var currentTheme = localStorage.getItem('whiteboard-theme') || 'light';
        if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        btnThemeToggle.addEventListener('click', function () {
          if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('whiteboard-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('whiteboard-theme', 'dark');
          }
        });
      }
    })();

    })();
  </script>
</body>
